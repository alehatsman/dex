# Multi-repo retrieval benchmark corpus (#278, epic #246).
#
# Each entry is a popular OSS repo pinned at a release tag's commit. The corpus
# runner (`dex bench corpus run`) fetches each at its pin, indexes it, and scores
# the live Search path against every declared golden set — reporting
# NDCG/Recall/MRR per (repo, set) so retrieval tuning is validated across
# languages, not just dex's own Go codebase.
#
# Query sources per repo (at least one required):
#   - query_sets: paths (relative to THIS file's directory) to committed,
#     hand-curated eval.GoldenSet JSON — NL question -> relevant files. These are
#     the high-signal labels; add them under queries/<name>.json.
#   - gen: auto-labels mined from the repo's OWN history at the pin (free,
#     noisier). git_history = commit subject -> touched files; blast_radius =
#     anchor excerpt -> co-changed files; structural = prose commit subject +
#     multi-package co-changed files with no cross-imports (graph-lane probe,
#     #279). max_commits/max_files: 0 = eval default.
#
# Commits are pinned to release tags (resolved via `git ls-remote --tags`) so
# the corpus never drifts. Refresh a pin by bumping `commit` to a newer tag.
#
# Start small: flask + gin + ripgrep + zod (fast; py/go/rust/ts). react is the
# large flagship — add it in a second pass (see the commented block) and bound
# its index cost with index_subdir.
#
# #493 Phase 1 extends coverage to the C-family + JVM (guava/leveldb/redis) and
# adds a database/systems domain plus a large-haystack tier (redis ~150k LOC).
# See the block at the end of this file.

repos:
  - name: flask
    url: https://github.com/pallets/flask
    commit: ab8149664182b662453a563161aa89013c806dc9   # tag 3.1.0
    languages: [python]
    query_sets: [queries/flask.json]
    trace_sets: [../trace/flask-py.json]
    gen:
      git_history:  { enabled: true, max_commits: 500, max_files: 5 }
      blast_radius: { enabled: true, max_commits: 500, max_files: 5 }
      structural:   { enabled: true, max_commits: 500, max_files: 5 }

  - name: gin
    url: https://github.com/gin-gonic/gin
    commit: 4ea0e648e38a63d6caff14100f5eab5c50912bcd   # tag v1.9.1
    languages: [go]
    query_sets: [queries/gin.json]
    gen:
      git_history:  { enabled: true, max_commits: 500, max_files: 5 }
      blast_radius: { enabled: true, max_commits: 500, max_files: 5 }
      structural:   { enabled: true, max_commits: 500, max_files: 5 }

  - name: ripgrep
    url: https://github.com/BurntSushi/ripgrep
    commit: 4649aa9700619f94cf9c66876e9549d83420e16c   # tag 14.1.1
    languages: [rust]
    query_sets: [queries/ripgrep.json]
    trace_sets: [../trace/ripgrep-rust.json]
    gen:
      git_history:  { enabled: true, max_commits: 500, max_files: 5 }
      blast_radius: { enabled: true, max_commits: 500, max_files: 5 }
      structural:   { enabled: true, max_commits: 500, max_files: 5 }

  - name: zod
    url: https://github.com/colinhacks/zod
    commit: 1fb56a5c18c27102dbc92260a4007c7732a0ccca   # tag v4.4.3
    languages: [ts]
    query_sets: [queries/zod.json]
    trace_sets: [../trace/zod-ts.json]
    gen:
      git_history:  { enabled: true, max_commits: 500, max_files: 5 }
      blast_radius: { enabled: true, max_commits: 500, max_files: 5 }
      structural:   { enabled: true, max_commits: 500, max_files: 5 }

  # react — flagship, large monorepo. Cost is bounded with index_subdir to a
  # single substantive package. NB: the public `packages/react-dom` is a thin
  # entry-point/re-export shell; the real DOM logic (synthetic events, event
  # plugins, DOM property/attribute diffing, controlled inputs, hydration, the
  # fiber host config) lives in `packages/react-dom-bindings` — so that is the
  # indexed subtree and curated paths are relative to it (src/events/…, etc.).
  - name: react
    url: https://github.com/facebook/react
    commit: 6117d7cca4906492c51fe6a03381e35adfd86e7d   # lightweight tag v19.2.7 (points straight at the commit)
    languages: [js]
    index_subdir: packages/react-dom-bindings
    query_sets: [queries/react.json]
    gen:
      # gen honors index_subdir (#285): the generators scope git log to the
      # subdir and emit subdir-relative paths, so labels match the index.
      git_history:  { enabled: true, max_commits: 500, max_files: 5 }
      blast_radius: { enabled: true, max_commits: 500, max_files: 5 }
      structural:   { enabled: true, max_commits: 500, max_files: 5 }

  # ── #493 Phase 1: language + domain + scale coverage ─────────────────────
  # Closes the C-family / JVM gap (corpus was py/go/rust/ts/js only) and adds a
  # database/systems domain + a large-haystack tier. Pins are release-tag
  # commits — all three are lightweight tags, so the SHA *is* the commit
  # (`git ls-remote <url> 'refs/tags/<tag>^{}' refs/tags/<tag>` returns no
  # peeled `^{}` line). blast_radius is enabled to match gin and give the
  # graph-lane co-change probe uniform coverage — it is the corpus regression
  # guard for #468 (cross-language symbol-graph parity).
  #
  # Each entry carries a curated query set (queries/<name>.json) whose
  # relevant_files were read-verified at the pin (subdir-relative where
  # index_subdir is set), plus the three git-mined gen flavors.

  - name: guava
    url: https://github.com/google/guava
    commit: 5c71d2a15435399fa62508d807d5cc83506f7496   # tag v33.4.0
    languages: [java]
    # Bound the monorepo to the core library source; skips guava-tests,
    # guava-gwt, and the android/ variant. Curated relevant_files are relative
    # to this subdir (#285).
    index_subdir: guava/src/com/google/common
    query_sets: [queries/guava.json]
    trace_sets: [../trace/guava-java.json]
    gen:
      git_history:  { enabled: true, max_commits: 500, max_files: 5 }
      blast_radius: { enabled: true, max_commits: 500, max_files: 5 }
      structural:   { enabled: true, max_commits: 500, max_files: 5 }

  # gotify — the polyglot cell for #468 gate-2 (cross-language centrality skew).
  # A real Go backend (~135 .go) + TypeScript frontend (~67 .ts/.tsx) in one
  # repo, so a single index holds both languages' call graphs. `skew: true`
  # opts it into `dex bench skew`; it is intentionally NOT in the retrieval or
  # trace lanes (no query_sets/trace_sets/gen) — skew is its only eval source,
  # which keeps it cheap (graph-only index, GPU-free). Measures whether Go's
  # type-resolved (dense) graph inflates its PageRank share over the
  # name-resolved TS graph: the gate-2 distortion #499 was meant to fix.
  - name: gotify
    url: https://github.com/gotify/server
    commit: 4fa74cea55137dc56bacda3fa7ff694f24b5efc0   # tag v2.9.1
    languages: [go, ts]
    skew: true

  - name: leveldb
    url: https://github.com/google/leveldb
    commit: 99b3c03b3284f5886f9ef9a4ef703d57373e61be   # tag 1.23
    languages: [cpp]
    # Small, clean C++ (db/, table/, util/, include/) — no index_subdir needed.
    query_sets: [queries/leveldb.json]
    gen:
      git_history:  { enabled: true, max_commits: 500, max_files: 5 }
      blast_radius: { enabled: true, max_commits: 500, max_files: 5 }
      structural:   { enabled: true, max_commits: 500, max_files: 5 }

  - name: redis
    url: https://github.com/redis/redis
    commit: a0a6f23d997b024689ba157916837f493a593a34   # tag 7.4.2
    languages: [c]
    # Scale tier + database/systems domain. index_subdir: src scopes to the
    # core (~150k LOC of .c/.h) and skips vendored deps/ (jemalloc, lua,
    # hiredis) that would otherwise dominate the index.
    index_subdir: src
    query_sets: [queries/redis.json]
    gen:
      git_history:  { enabled: true, max_commits: 500, max_files: 5 }
      blast_radius: { enabled: true, max_commits: 500, max_files: 5 }
      structural:   { enabled: true, max_commits: 500, max_files: 5 }
