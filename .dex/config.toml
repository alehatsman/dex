# dex indexing config. Indexing is opt-in: only paths matching an
# include pattern below are indexed; everything else (benchmark/,
# generated output, build artifacts) is skipped. Patterns use gitignore
# grammar — a trailing slash matches a directory subtree, `*.md` matches
# at any depth.
[index]
include = [
  "cmd/",
  "internal/",
  "docs/",
  "scripts/",
  "*.md",
  "tasks.yml",
  "go.mod",
  "Dockerfile",
]

# Carve-outs *within* the included trees (same grammar). benchmark/ and
# other top-level dirs are already excluded simply by not being included
# above, so they need no entry here.
ignore = []
